name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DDIMENSION5_ENABLE_ASAN=ON -DDIMENSION5_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render offline WAVs
        run: ./build/dimension5_offline_render out
      - name: Upload WAV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-wav-${{ matrix.compiler }}
          path: out/*.wav

  web:
    name: Web/WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WASM
        run: web/scripts/build-wasm.sh
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-web
          path: web/dist
