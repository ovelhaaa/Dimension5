name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/requirements-validation.txt
      - name: Install Validation Dependencies
        run: pip install -r tools/requirements-validation.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DDIMENSION5_ENABLE_ASAN=ON -DDIMENSION5_ENABLE_UBSAN=ON -DDIMENSION5_STRICT_CI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark Incremental A.4 vs B.1
        run: ./build/dimension5_bench out
      - name: Render offline WAVs
        run: ./build/dimension5_offline_render out --spectral
      - name: Compare Phase A.4 vs Phase B.1 (Mandatory A/B Integrity)
        run: python3 tools/compare_phase_a4_b1.py out
      - name: A/B Comparator Negative Tests
        run: python3 tools/test_compare_phase_a4_b1.py
      - name: Build Listening Review Package
        run: python3 tools/build_listening_package.py out
      - name: Render Phase A.3 vs A.4 A/B Fixtures
        run: ./build/dimension5_render_phase_a3_a4 out
      - name: Compare Phase A.3 vs A.4 Regression
        run: python3 tools/compare_phase_a3_a4.py out
      - name: Generate BBD Clock Trace and Invariance
        run: ./build/dimension5_bbd_clock_trace out
      - name: Spectral Generator Precision
        run: python3 tools/test_generator_precision.py out
      - name: Negative Validator Tests
        run: python3 tools/test_spectral_analyzer.py
      - name: BBD Audio Characterization
        run: python3 tools/analyze_bbd_character.py out
      - name: BBD High-Resolution Spectral Validation
        run: python3 tools/run_spectral_analysis.py out
      - name: BBD Clock Accuracy & Invariance Validation
        run: python3 tools/validate_clock_and_invariance.py out
      - name: Summary Aggregator Negative Suite
        run: python3 tools/test_validation_summary.py out
      - name: Consolidated Validation Summary
        run: python3 tools/generate_validation_summary.py out
      - name: Upload Audio Analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-audio-analysis-${{ matrix.compiler }}
          path: |
            out/*.wav
            out/*.json
            out/*.csv
            out/listening_review.zip
            out/listening_review/**
            docs/spectral/*.png
      - name: Spatial Engine 2.0 Full Validation
        if: matrix.compiler == 'gcc'
        run: ./build/dimension5_spatial_engine_validation --full tests/test_vectors/legacy_baseline docs/audio/spatial-engine-2.0
      - name: Upload Spatial Engine Validation Report
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-spatial-validation
          path: |
            docs/audio/spatial-engine-2.0/*.wav
            docs/audio/spatial-engine-2.0/*.json

  web:
    name: Web/WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WASM
        run: web/scripts/build-wasm.sh
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-web
          path: web/dist

  vst3:
    name: VST3 plugin (Windows/JUCE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: external/JUCE

      - name: Configure plugin
        run: >
          cmake -S . -B build-plugin
          -DDIMENSION5_BUILD_JUCE_PLUGIN=ON
          -DDIMENSION5_JUCE_DIR="${{ github.workspace }}/external/JUCE"

      - name: Build VST3 and Tests
        run: cmake --build build-plugin --config Release --parallel

      - name: Run JUCE tests
        run: ctest --test-dir build-plugin --output-on-failure -C Release

      - name: Repeat SnapshotBuffer concurrency suite (50x)
        shell: pwsh
        run: |
          $exe = "build-plugin/plugin/juce/Release/dimension5_snapshot_standalone_tests.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "SnapshotBuffer test executable not found at $exe"
          }
          $failures = 0
          for ($i = 1; $i -le 50; $i++) {
            & $exe *> $null
            if ($LASTEXITCODE -ne 0) {
              $failures++
              Write-Host "SnapshotBuffer repetition $i FAILED (exit $LASTEXITCODE)"
            }
          }
          Write-Host "SnapshotBuffer repetition: $((50 - $failures))/50 passed, $failures failed"
          if ($failures -ne 0) {
            throw "$failures/50 SnapshotBuffer concurrency runs failed"
          }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-vst3-windows
          path: build-plugin/plugin/juce/Dimension5Plugin_artefacts/Release/VST3/*.vst3

      - name: Upload UI Snapshots
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-ui-snapshots
          path: |
            docs/snapshots/ui21/*.png
            docs/snapshots/ui212/*.png
