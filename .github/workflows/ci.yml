name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DDIMENSION5_ENABLE_ASAN=ON -DDIMENSION5_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render offline WAVs
        run: ./build/dimension5_offline_render out
      - name: Upload WAV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-wav-${{ matrix.compiler }}
          path: out/*.wav

  web:
    name: Web/WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WASM
        run: web/scripts/build-wasm.sh
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-web
          path: web/dist

  vst3:
    name: VST3 plugin (Windows/JUCE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: external/JUCE

      - name: Configure plugin
        run: >
          cmake -S . -B build-plugin
          -DDIMENSION5_BUILD_JUCE_PLUGIN=ON
          -DDIMENSION5_JUCE_DIR="${{ github.workspace }}/external/JUCE"

      - name: Build VST3
        run: cmake --build build-plugin --config Release --target Dimension5Plugin_VST3 --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-vst3-windows
          path: build-plugin/plugin/juce/Dimension5Plugin_artefacts/Release/VST3/*.vst3
