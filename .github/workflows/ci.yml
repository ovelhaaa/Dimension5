name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native C (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DDIMENSION5_ENABLE_ASAN=ON -DDIMENSION5_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        run: ./build/dimension5_bench
      - name: Render offline WAVs
        run: ./build/dimension5_offline_render out --spectral
      - name: Negative Validator Tests
        run: python3 tools/test_spectral_analyzer.py
      - name: BBD Audio Characterization
        run: python3 tools/analyze_bbd_character.py out
      - name: BBD High-Resolution Spectral Validation
        run: python3 tools/run_spectral_analysis.py out
      - name: Upload Audio Analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-audio-analysis-${{ matrix.compiler }}
          path: |
            out/*.wav
            out/*.json
            out/*.csv
            docs/spectral/*.png
      - name: Spatial Engine 2.0 Full Validation
        if: matrix.compiler == 'gcc'
        run: ./build/dimension5_spatial_engine_validation --full tests/test_vectors/legacy_baseline docs/audio/spatial-engine-2.0
      - name: Upload Spatial Engine Validation Report
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-spatial-validation
          path: |
            docs/audio/spatial-engine-2.0/*.wav
            docs/audio/spatial-engine-2.0/*.json

  web:
    name: Web/WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WASM
        run: web/scripts/build-wasm.sh
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-web
          path: web/dist

  vst3:
    name: VST3 plugin (Windows/JUCE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.6
          path: external/JUCE

      - name: Configure plugin
        run: >
          cmake -S . -B build-plugin
          -DDIMENSION5_BUILD_JUCE_PLUGIN=ON
          -DDIMENSION5_JUCE_DIR="${{ github.workspace }}/external/JUCE"

      - name: Build VST3 and Tests
        run: cmake --build build-plugin --config Release --parallel

      - name: Run JUCE tests
        run: ctest --test-dir build-plugin --output-on-failure -C Release

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-vst3-windows
          path: build-plugin/plugin/juce/Dimension5Plugin_artefacts/Release/VST3/*.vst3

      - name: Upload UI Snapshots
        uses: actions/upload-artifact@v4
        with:
          name: dimension5-ui-snapshots
          path: |
            docs/snapshots/ui21/*.png
            docs/snapshots/ui212/*.png
