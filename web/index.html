<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dimension5 Workbench</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2710%27 fill=%27%23111%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-size=%2732%27 text-anchor=%27middle%27 fill=%27%23f9a826%27%3ED5%3C/text%3E%3C/svg%3E" />
    <style>
      :root { --bg:#0f1115; --panel:#1a1d23; --accent:#f9a826; --text:#e7e8ea; --muted:#8f96a3; }
      body { margin:0; font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at top,#1d222b,#0b0d10 55%); color:var(--text); }
      .rack { max-width:1100px; margin:24px auto; padding:20px; background:linear-gradient(180deg,#2a2f39,#1a1d23); border:1px solid #3a404f; border-radius:16px; box-shadow:0 16px 40px #0008; }
      h1 { margin:0 0 4px; letter-spacing:.05em; }
      .sub { color:var(--muted); margin-bottom:16px; }
      .top { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      .panel { background:var(--panel); border:1px solid #323846; border-radius:12px; padding:14px; }
      .btns { display:flex; gap:8px; flex-wrap:wrap; }
      button, select, input[type=file] { background:#11151b; color:var(--text); border:1px solid #475066; border-radius:9px; padding:8px 12px; }
      button.active, button:hover { border-color:var(--accent); }
      #drop-zone { margin-top:10px; border:2px dashed #4b5261; border-radius:10px; padding:16px; text-align:center; color:var(--muted); }
      #drop-zone.dragging { border-color:var(--accent); color:var(--text); }
      #controls { margin-top:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
      .control { display:grid; gap:6px; background:#10141b; border:1px solid #2f3544; border-radius:10px; padding:10px; }
      .control span { text-transform:uppercase; font-size:12px; color:var(--muted); }
      .status { margin-top:12px; background:#0e1218; border:1px solid #2f3544; border-radius:10px; padding:10px; color:#d6dbe5; }
    </style>
  </head>
  <body>
    <main class="rack">
      <h1>DIMENSION5 // WEB WORKBENCH</h1>
      <div class="sub">AudioWorklet + WASM DSP bridge</div>
      <section class="top">
        <div class="panel">
          <div class="btns">
            <button id="btn-play">Play</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-repeat">Loop ON</button>
            <button id="btn-bypass">Bypass OFF</button>
            <button id="btn-render">Export WAV (Offline)</button>
          </div>
          <div style="margin-top:8px;">Modo:
            <select id="mode"><option value="0">I</option><option value="1">II</option><option value="2">III</option><option value="3">IV</option><option value="4">Custom</option></select>
          </div>
        </div>
        <div class="panel">
          <input id="audio-file" type="file" accept="audio/wav,audio/mp3,audio/*" />
          <div id="drop-zone">Arraste WAV/MP3 aqui para processar em tempo real</div>
        </div>
      </section>
      <section id="controls"></section>
      <div id="status" class="status">inicializando...</div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
