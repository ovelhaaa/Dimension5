<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-labelledby="title desc">
  <title id="title">Dimension5 current plugin GUI mockup</title>
  <desc id="desc">A dark hardware-style Dimension5 chorus plugin interface with preset and mode selectors, A/B compare, Bypass and Advanced buttons, plus Input, Output, Width, and Mix knobs.</desc>

  <defs>
    <linearGradient id="outerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11100e"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161410"/>
      <stop offset="1" stop-color="#11100d"/>
    </linearGradient>
    <linearGradient id="knobFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a251b"/>
      <stop offset="1" stop-color="#11100d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="620" height="320" fill="url(#outerBg)"/>
  <rect x="10.5" y="10.5" width="599" height="299" rx="8" fill="url(#panelBg)" stroke="#322a1c"/>

  <g transform="translate(24 24)">
    <text x="0" y="25" fill="#da8e1c" font-family="Rajdhani, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">DIMENSION5</text>
    <text x="1" y="51" fill="#898163" font-family="Segoe UI, Arial, sans-serif" font-size="13">BBD-lite stereo dimension chorus</text>

    <g transform="translate(362 0)">
      <rect x="0" y="0" width="210" height="30" rx="4" fill="#1d1a14" stroke="#3f3422"/>
      <text x="12" y="20" fill="#d0c8a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Studio Dimension</text>
      <path d="M190 11 l6 6 l6 -6" fill="none" stroke="#da8e1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="38" width="210" height="30" rx="4" fill="#1d1a14" stroke="#3f3422"/>
      <text x="12" y="58" fill="#d0c8a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mode I</text>
      <path d="M190 49 l6 6 l6 -6" fill="none" stroke="#da8e1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <line x1="0" y1="70" x2="572" y2="70" stroke="#201c14"/>
  </g>

  <g transform="translate(24 99)">
    <rect x="0" y="0" width="32" height="26" rx="4" fill="#2b2112" stroke="#6a451c"/>
    <text x="16" y="17" text-anchor="middle" fill="#da8e1c" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">A</text>
    <rect x="38" y="0" width="32" height="26" rx="4" fill="#1d1a14" stroke="#3f3422"/>
    <text x="54" y="17" text-anchor="middle" fill="#898163" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">B</text>
    <rect x="76" y="0" width="58" height="26" rx="4" fill="#1d1a14" stroke="#3f3422"/>
    <text x="105" y="17" text-anchor="middle" fill="#898163" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">COPY</text>
  </g>

  <g transform="translate(400 99)">
    <rect x="0" y="0" width="84" height="26" rx="4" fill="#1d1a14" stroke="#3f3422"/>
    <text x="42" y="17" text-anchor="middle" fill="#898163" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">BYPASS</text>
  </g>

  <g transform="translate(492 99)">
    <rect x="0" y="0" width="104" height="26" rx="4" fill="#1d1a14" stroke="#3f3422"/>
    <text x="52" y="17" text-anchor="middle" fill="#898163" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">ADVANCED</text>
  </g>

  <g transform="translate(48 126)" filter="url(#softShadow)">
    <g transform="translate(0 0)">
      <circle cx="52" cy="48" r="43" fill="#100f0c" stroke="#352d1f" stroke-width="2"/>
      <circle cx="52" cy="48" r="35" fill="url(#knobFace)" stroke="#3b3222"/>
      <path d="M23 76 A41 41 0 0 1 81 18" fill="none" stroke="#5a4523" stroke-width="5" stroke-linecap="round"/>
      <path d="M23 76 A41 41 0 0 1 52 7" fill="none" stroke="#da8e1c" stroke-width="5" stroke-linecap="round"/>
      <line x1="52" y1="48" x2="52" y2="18" stroke="#da8e1c" stroke-width="3" stroke-linecap="round"/>
      <text x="52" y="114" text-anchor="middle" fill="#84520c" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.4">INPUT</text>
      <text x="52" y="137" text-anchor="middle" fill="#d0c8a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">1.00x</text>
    </g>

    <g transform="translate(130 0)">
      <circle cx="52" cy="48" r="43" fill="#100f0c" stroke="#352d1f" stroke-width="2"/>
      <circle cx="52" cy="48" r="35" fill="url(#knobFace)" stroke="#3b3222"/>
      <path d="M23 76 A41 41 0 0 1 81 18" fill="none" stroke="#5a4523" stroke-width="5" stroke-linecap="round"/>
      <path d="M23 76 A41 41 0 0 1 52 7" fill="none" stroke="#da8e1c" stroke-width="5" stroke-linecap="round"/>
      <line x1="52" y1="48" x2="52" y2="18" stroke="#da8e1c" stroke-width="3" stroke-linecap="round"/>
      <text x="52" y="114" text-anchor="middle" fill="#84520c" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.4">OUTPUT</text>
      <text x="52" y="137" text-anchor="middle" fill="#d0c8a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">1.00x</text>
    </g>

    <g transform="translate(260 0)">
      <circle cx="52" cy="48" r="43" fill="#100f0c" stroke="#352d1f" stroke-width="2"/>
      <circle cx="52" cy="48" r="35" fill="url(#knobFace)" stroke="#3b3222"/>
      <path d="M23 76 A41 41 0 0 1 81 18" fill="none" stroke="#5a4523" stroke-width="5" stroke-linecap="round"/>
      <path d="M23 76 A41 41 0 0 1 62 8" fill="none" stroke="#da8e1c" stroke-width="5" stroke-linecap="round"/>
      <line x1="52" y1="48" x2="60" y2="19" stroke="#da8e1c" stroke-width="3" stroke-linecap="round"/>
      <text x="52" y="114" text-anchor="middle" fill="#84520c" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.4">WIDTH</text>
      <text x="52" y="137" text-anchor="middle" fill="#d0c8a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">1.00</text>
    </g>

    <g transform="translate(390 0)">
      <circle cx="52" cy="48" r="43" fill="#100f0c" stroke="#352d1f" stroke-width="2"/>
      <circle cx="52" cy="48" r="35" fill="url(#knobFace)" stroke="#3b3222"/>
      <path d="M23 76 A41 41 0 0 1 81 18" fill="none" stroke="#5a4523" stroke-width="5" stroke-linecap="round"/>
      <path d="M23 76 A41 41 0 0 1 83 22" fill="none" stroke="#da8e1c" stroke-width="5" stroke-linecap="round"/>
      <line x1="52" y1="48" x2="75" y2="28" stroke="#da8e1c" stroke-width="3" stroke-linecap="round"/>
      <text x="52" y="114" text-anchor="middle" fill="#84520c" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1.4">MIX</text>
      <text x="52" y="137" text-anchor="middle" fill="#d0c8a8" font-family="Segoe UI, Arial, sans-serif" font-size="13">100%</text>
    </g>
  </g>

  <g transform="translate(24 270)">
    <text x="0" y="10" fill="#635b45" font-family="Segoe UI, Arial, sans-serif" font-size="10">L</text>
    <rect x="18" y="2" width="554" height="8" fill="#191611" stroke="#362d1e"/>
    <rect x="18" y="2" width="318" height="8" fill="#da8e1c"/>
    <text x="0" y="26" fill="#635b45" font-family="Segoe UI, Arial, sans-serif" font-size="10">R</text>
    <rect x="18" y="18" width="554" height="8" fill="#191611" stroke="#362d1e"/>
    <rect x="18" y="18" width="302" height="8" fill="#da8e1c"/>
  </g>

  <g transform="translate(24 304)">
    <circle cx="6" cy="0" r="4" fill="#3a9858"/>
    <text x="18" y="4" fill="#635b45" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.3">VST3 / JUCE MOCKUP</text>
  </g>
</svg>
